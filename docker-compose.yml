services:
  postgres:
    image: postgres:16-alpine
    container_name: tacomquem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tacomquem
      POSTGRES_PASSWORD: tacomquem_dev_password
      POSTGRES_DB: tacomquem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacomquem -d tacomquem"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
