services:
  postgres:
    image: postgres:16-alpine
    container_name: tacomquem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tacomquem
      POSTGRES_PASSWORD: tacomquem_dev_password
      POSTGRES_DB: tacomquem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacomquem -d tacomquem"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tacomquem-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tacq_minio
      MINIO_ROOT_PASSWORD: tacq_minio_dev_password
    volumes:
      - minio_data:/minio/data
    command: ["server", "/minio/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
