name: Deploy to GCE VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/var/www/api' }}"
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            /home/deploy/.bun/bin/bun install
            /home/deploy/.bun/bin/bun run build || true
            sudo systemctl restart api
            sudo systemctl --no-pager --full status api | sed -n '1,25p'
