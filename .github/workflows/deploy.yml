name: Deploy to GCE VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "❌ VM_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo "❌ VM_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "❌ VM_SSH_KEY secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/var/www/api' }}"
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            /home/deploy/.bun/bin/bun install
            sudo systemctl restart api
            sudo systemctl --no-pager --full status api | sed -n '1,25p'
